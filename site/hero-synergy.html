<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hero Synergy</title>
    <link rel="stylesheet" href="css/hero-synergy.css"/>
</head>
<body>
<nav class="main-nav">
    <ul class="menu">
        <li><a href="index.html">Главная</a></li>
        <li><a href="heroes.html" class="current">Heroes</a></li>
        <li><a href="stats.html">Статистика</a></li>
    </ul>
</nav>

<div class="container">
    <div class="hero-info-details">
        <div class="hero-info-header">
            <img id="hero-info-img" alt="Hero Image">
            <div class="hero-info-info">
                <h1 id="hero-info-name">Hero Name</h1>
                <p id="hero-info-attribute">Attribute: Strength / Agility / Intelligence</p>
                <p id="hero-info-roles">Roles: Carry, Support</p>
            </div>
        </div>

        <!-- Подменю -->
        <div class="hero-info-submenu">
            <ul class="submenu">
                <li><a href="hero-info.html" class="submenu-item">Info</a></li>
                <li><a href="hero-synergy.html" class="submenu-item active">Synergy</a></li>
            </ul>
        </div>

        <!-- Здесь будет будущий блок с синергией -->
        <div class="synergy-table">
            <h2>Hero Synergy</h2>
            <table>
                <thead>
                <tr>
                    <th>Hero</th>
                    <th>Synergy Score</th>
                </tr>
                </thead>
                <tbody id="synergy-data">
                <!-- Данные будут добавлены через JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/hero-synergy.js"></script>
</body>
</html>
