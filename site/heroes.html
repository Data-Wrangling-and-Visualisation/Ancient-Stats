<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota 2 Heroes</title>
  <link rel="stylesheet" href="css/heroes.css">
</head>
<body>
  <nav class="main-nav">
    <ul class="menu">
      <li><a href="heroes.html" class="current">Heroes</a></li>
      <li><a href="stats.html">Statistics</a></li>
            <li><a href="hero_wins.html">Attributes</a></li>
    </ul>
  </nav>

  <div class="container">

  <div class="attribute-grid">
    <!-- Strength + Agility -->
    <div class="attribute-pair">
      <div class="attribute-section">
        <div class="attribute-header str-header">
          <img src="https://www.dotabuff.com/assets/hero_str.png" alt="Strength">
          <h2>Strength</h2>
        </div>
        <div class="heroes-grid" id="str-heroes"></div>
      </div>

      <div class="attribute-section">
        <div class="attribute-header agi-header">
          <img src="https://www.dotabuff.com/assets/hero_agi.png" alt="Agility">
          <h2>Agility</h2>
        </div>
        <div class="heroes-grid" id="agi-heroes"></div>
      </div>
    </div>

    <!-- Intelligence + Universal -->
    <div class="attribute-pair">
      <div class="attribute-section">
        <div class="attribute-header int-header">
          <img src="https://www.dotabuff.com/assets/hero_int.png" alt="Intelligence">
          <h2>Intelligence</h2>
        </div>
        <div class="heroes-grid" id="int-heroes"></div>
      </div>

      <div class="attribute-section">
        <div class="attribute-header universal-header">
          <img src="https://www.dotabuff.com/assets/hero_all.png" alt="Universal">
          <h2>Universal</h2>
        </div>
        <div class="heroes-grid" id="universal-heroes"></div>
      </div>
    </div>
  </div>
</div>


  <script src="js/heroes.js"></script>
</body>
</html>
