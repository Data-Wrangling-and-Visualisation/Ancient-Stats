<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Player Stats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Dota 2 Player Stats</h1>
        
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="playerId" class="form-label">Player ID</label>
                            <input type="text" class="form-control" id="playerId" placeholder="Enter player ID">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="matchCount" class="form-label">Number of Matches</label>
                            <input type="number" class="form-control" id="matchCount" value="50" min="1">
                        </div>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button id="fetchBtn" class="btn btn-primary w-100">Get Stats</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Hero Statistics</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover" id="statsTable">
                                <thead>
                                    <tr>
                                        <th>Hero</th>
                                        <th>Matches</th>
                                        <th>Win Rate</th>
                                        <th>Avg Kills</th>
                                        <th>Avg Deaths</th>
                                        <th>Avg Assists</th>
                                        <th>Avg Duration</th>
                                    </tr>
                                </thead>
                                <tbody id="statsBody">
                                    <!-- Data will be inserted here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Hero Distribution</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="heroChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/script.js"></script>
</body>
</html>
